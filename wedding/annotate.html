<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Annotator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Parisienne&family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1b18; --muted: #6b665e;
    --line: #dcd7ce; --accent: #2f6fdf; --stage: #e7e3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18171a; --panel: #222126; --ink: #ecebe8; --muted: #9a968f;
            --line: #36343a; --accent: #6b9bff; --stage: #111013; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink);
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
             padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .group { display: flex; gap: 6px; align-items: center; }
  .sep { width: 1px; align-self: stretch; background: var(--line); }
  label.lbl { color: var(--muted); font-size: 12px; }
  button, select, input[type=number] {
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.toggle.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled, select:disabled, input:disabled { opacity: .45; cursor: default; }
  input[type=number] { width: 64px; }
  input[type=color] { width: 34px; height: 30px; padding: 0; border: 1px solid var(--line);
                      border-radius: 6px; background: none; cursor: pointer; }
  input[type=range] { width: 80px; }
  select { max-width: 180px; }

  .workspace { flex: 1; overflow: auto; background: var(--stage);
               display: flex; align-items: center; justify-content: center; padding: 24px; }
  .empty { text-align: center; color: var(--muted); border: 2px dashed var(--line);
           border-radius: 12px; padding: 48px 32px; max-width: 420px; }
  .empty.drag { border-color: var(--accent); color: var(--accent); }
  .stage { position: relative; display: none; user-select: none;
           box-shadow: 0 4px 24px rgba(0,0,0,.18); }
  .stage img { display: block; max-width: none; pointer-events: none; }

  .box { position: absolute; min-width: 20px; cursor: move;
         outline: 1px dashed transparent; outline-offset: 0; }
  .box:hover { outline-color: rgba(47,111,223,.6); }
  .box.selected { outline: 1.5px solid var(--accent); }
  .box .text { white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word;
               line-height: 1.2; outline: none; min-height: 1.2em; cursor: inherit; }
  .box.editing { cursor: text; }
  .box.editing .text { cursor: text; user-select: text; }
  .handle { position: absolute; width: 12px; height: 12px; background: #fff;
            border: 1.5px solid var(--accent); border-radius: 2px; display: none; }
  .box.selected .handle { display: block; }
  .handle.e  { right: -7px; top: 50%; margin-top: -6px; cursor: ew-resize; }
  .handle.w  { left: -7px;  top: 50%; margin-top: -6px; cursor: ew-resize; }
  .handle.se { right: -7px; bottom: -7px; cursor: nwse-resize; }

  .hint { font-size: 12px; color: var(--muted); padding: 6px 16px; background: var(--panel);
          border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="toolbar">
  <div class="group">
    <button id="openBtn">Open image…</button>
    <input id="file" type="file" accept="image/*" hidden>
    <button id="addBtn" disabled>+ Text box</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label class="lbl" for="font">Font</label>
    <select id="font" data-prop="family">
      <option>Playfair Display</option>
      <option>Cormorant Garamond</option>
      <option>Lora</option>
      <option>Montserrat</option>
      <option>Great Vibes</option>
      <option>Parisienne</option>
      <option>Dancing Script</option>
      <option>Georgia</option>
      <option>Times New Roman</option>
      <option>Helvetica</option>
      <option>Arial</option>
      <option>Courier New</option>
    </select>
    <label class="lbl" for="size">Size</label>
    <input id="size" type="number" min="4" max="1000" data-prop="size">
    <button id="bold" class="toggle" data-prop="bold" title="Bold"><b>B</b></button>
    <button id="italic" class="toggle" data-prop="italic" title="Italic"><i>I</i></button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label class="lbl" for="color">Color</label>
    <input id="color" type="color" data-prop="color">
    <select id="align" data-prop="align" title="Alignment">
      <option value="left">Left</option>
      <option value="center">Center</option>
      <option value="right">Right</option>
    </select>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="bgOn" class="toggle" data-prop="bgOn" title="Fill behind text">Background</button>
    <input id="bg" type="color" data-prop="bg">
    <input id="bgAlpha" type="range" min="0" max="100" data-prop="bgAlpha" title="Background opacity">
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="delBtn" disabled>Delete box</button>
    <button id="exportBtn" class="primary" disabled>Download PNG</button>
  </div>
</div>

<div class="workspace" id="workspace">
  <div class="empty" id="empty">
    <strong>Drop an image here</strong><br>or click “Open image…”, or paste with ⌘V
  </div>
  <div class="stage" id="stage"><img id="img" alt=""></div>
</div>
<div class="hint">Click image or “+ Text box” to add text · drag to move · drag side/corner handles to resize · double-click to edit · Delete removes selected box · Esc deselects</div>

<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), img = $('img'), workspace = $('workspace');

// Box geometry and font size are stored in natural image pixels; `scale` maps to screen.
let scale = 1, boxes = [], selected = null, imageName = 'image';
const defaults = { family: 'Playfair Display', size: 0, bold: false, italic: false,
                   color: '#ffffff', align: 'center', bgOn: false, bg: '#000000', bgAlpha: 50 };

// ---------- image loading ----------
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  imageName = file.name.replace(/\.[^.]+$/, '') || 'image';
  const url = URL.createObjectURL(file);
  img.onload = () => {
    boxes.forEach(b => b.el.remove()); boxes = []; select(null);
    defaults.size = Math.max(12, Math.round(img.naturalWidth / 20));
    $('empty').style.display = 'none';
    stage.style.display = 'block';
    $('addBtn').disabled = $('exportBtn').disabled = false;
    fit();
  };
  img.src = url;
}
$('openBtn').onclick = () => $('file').click();
$('file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
workspace.addEventListener('dragover', e => { e.preventDefault(); $('empty').classList.add('drag'); });
workspace.addEventListener('dragleave', () => $('empty').classList.remove('drag'));
workspace.addEventListener('drop', e => {
  e.preventDefault(); $('empty').classList.remove('drag');
  loadFile(e.dataTransfer.files[0]);
});
document.addEventListener('paste', e => {
  if (document.activeElement?.isContentEditable) return;
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) loadFile(item.getAsFile());
});

function fit() {
  if (!img.naturalWidth) return;
  const availW = workspace.clientWidth - 48, availH = workspace.clientHeight - 48;
  scale = Math.min(1, availW / img.naturalWidth, availH / img.naturalHeight);
  img.style.width = img.naturalWidth * scale + 'px';
  img.style.height = img.naturalHeight * scale + 'px';
  boxes.forEach(render);
}
window.addEventListener('resize', fit);

// ---------- boxes ----------
function hexToRgba(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
}
const fontCss = (b, px) => `${b.italic ? 'italic ' : ''}${b.bold ? '700 ' : '400 '}${px}px "${b.family}"`;
const pad = b => Math.round(b.size * 0.25);

function render(b) {
  const s = b.el.style, t = b.text.style;
  s.left = b.x * scale + 'px';
  s.top = b.y * scale + 'px';
  s.width = b.w * scale + 'px';
  s.minHeight = b.h * scale + 'px';
  s.padding = pad(b) * scale + 'px';
  s.background = b.bgOn ? hexToRgba(b.bg, b.bgAlpha / 100) : 'transparent';
  t.font = fontCss(b, b.size * scale);
  t.lineHeight = '1.2';
  t.color = b.color;
  t.textAlign = b.align;
}

function addBox(x, y) {
  const b = { ...defaults, ...(selected ? pick(selected) : {}) };
  b.w = Math.round(img.naturalWidth * 0.4);
  b.h = 0;
  b.x = x ?? Math.round((img.naturalWidth - b.w) / 2);
  b.y = y ?? Math.round(img.naturalHeight / 2 - b.size);
  b.x = Math.max(0, Math.min(b.x, img.naturalWidth - b.w));

  b.el = document.createElement('div');
  b.el.className = 'box';
  b.text = document.createElement('div');
  b.text.className = 'text';
  b.text.textContent = 'Your text';
  b.el.append(b.text);
  for (const dir of ['w', 'e', 'se']) {
    const h = document.createElement('div');
    h.className = 'handle ' + dir; h.dataset.dir = dir;
    b.el.append(h);
  }
  stage.append(b.el);
  boxes.push(b);
  render(b);
  wireBox(b);
  select(b);
  startEditing(b, true);
  return b;
}
const pick = b => Object.fromEntries(Object.keys(defaults).map(k => [k, b[k]]));

function startEditing(b, selectAll) {
  b.el.classList.add('editing');
  b.text.contentEditable = 'plaintext-only';
  if (b.text.contentEditable !== 'plaintext-only') b.text.contentEditable = 'true';
  b.text.focus();
  const r = document.createRange();
  r.selectNodeContents(b.text);
  if (!selectAll) r.collapse(false);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
}
function stopEditing(b) {
  if (!b) return;
  b.el.classList.remove('editing');
  b.text.contentEditable = 'false';
  getSelection().removeAllRanges();
}

function wireBox(b) {
  b.el.addEventListener('dblclick', e => { e.stopPropagation(); startEditing(b, false); });
  b.el.addEventListener('pointerdown', e => {
    e.stopPropagation();
    if (selected !== b) select(b);
    const dir = e.target.dataset.dir;
    if (!dir && b.el.classList.contains('editing')) return; // let text selection work
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY;
    const start = { x: b.x, y: b.y, w: b.w };
    const startH = b.el.offsetHeight / scale;  // total height incl. padding
    const move = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      const minW = b.size;
      if (!dir) { b.x = Math.round(start.x + dx); b.y = Math.round(start.y + dy); }
      if (dir === 'e' || dir === 'se') b.w = Math.max(minW, Math.round(start.w + dx));
      if (dir === 'w') {
        const w = Math.max(minW, Math.round(start.w - dx));
        b.x = start.x + start.w - w; b.w = w;
      }
      if (dir === 'se') b.h = Math.max(0, Math.round(startH + dy));
      render(b);
    };
    const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
    addEventListener('pointermove', move);
    addEventListener('pointerup', up);
  });
}

function select(b) {
  if (selected && selected !== b) stopEditing(selected);
  boxes.forEach(x => x.el.classList.toggle('selected', x === b));
  selected = b;
  $('delBtn').disabled = !b;
  syncControls();
}

function deleteBox(b) {
  b.el.remove();
  boxes = boxes.filter(x => x !== b);
  select(null);
}

stage.addEventListener('pointerdown', e => {
  if (e.target !== stage && e.target !== img) return;
  if (selected) { select(null); return; }  // first click just deselects
  const r = stage.getBoundingClientRect();
  const b = addBox(0, 0);
  b.x = Math.round((e.clientX - r.left) / scale - b.w / 2);
  b.y = Math.round((e.clientY - r.top) / scale - b.size * 0.6 - pad(b));
  b.x = Math.max(0, Math.min(b.x, img.naturalWidth - b.w));
  render(b);
  e.preventDefault();
  startEditing(b, true);
});
$('addBtn').onclick = () => addBox();
$('delBtn').onclick = () => selected && deleteBox(selected);

document.addEventListener('keydown', e => {
  if (!selected) return;
  const editing = selected.el.classList.contains('editing');
  if (e.key === 'Escape') { editing ? stopEditing(selected) : select(null); return; }
  if (editing) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteBox(selected); }
  if (e.key === 'Enter') { e.preventDefault(); startEditing(selected, false); }
  const step = e.shiftKey ? 10 : 1;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (arrows[e.key]) {
    e.preventDefault();
    selected.x += arrows[e.key][0] / scale; selected.y += arrows[e.key][1] / scale;
    render(selected);
  }
});

// ---------- style controls ----------
const controls = document.querySelectorAll('[data-prop]');
function syncControls() {
  const src = selected || defaults;
  controls.forEach(c => {
    const p = c.dataset.prop;
    if (c.classList.contains('toggle')) c.classList.toggle('on', !!src[p]);
    else c.value = src[p];
  });
}
function setProp(p, v) {
  defaults[p] = v;            // new boxes inherit the last-used style
  if (selected) { selected[p] = v; render(selected); }
  syncControls();
}
controls.forEach(c => {
  const p = c.dataset.prop;
  // Keep focus (and text caret) in the box when clicking toggle buttons
  c.addEventListener('pointerdown', e => { if (c.tagName === 'BUTTON') e.preventDefault(); });
  if (c.classList.contains('toggle')) c.onclick = () => setProp(p, !(selected || defaults)[p]);
  else c.addEventListener('input', () => {
    let v = c.value;
    if (p === 'size' || p === 'bgAlpha') { v = +v; if (!v && p === 'size') return; }
    setProp(p, v);
  });
});
syncControls();

// ---------- export ----------
function wrapLines(ctx, text, maxW) {
  const out = [];
  for (const para of text.replace(/\n$/, '').split('\n')) {
    const words = para.split(/(\s+)/);
    let line = '';
    for (const tok of words) {
      const test = line + tok;
      if (ctx.measureText(test).width <= maxW || line === '') {
        line = test;
        // break a single overlong word by characters
        while (ctx.measureText(line).width > maxW && line.length > 1) {
          let i = line.length - 1;
          while (i > 1 && ctx.measureText(line.slice(0, i)).width > maxW) i--;
          out.push(line.slice(0, i)); line = line.slice(i);
        }
      } else {
        out.push(line.trimEnd());
        line = tok.trimStart();
      }
    }
    out.push(line.trimEnd());
  }
  return out;
}

$('exportBtn').onclick = async () => {
  if (selected) stopEditing(selected);
  await document.fonts.ready;
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  for (const b of boxes) {
    const p = pad(b), innerW = b.w - 2 * p, lh = b.size * 1.2;
    ctx.font = fontCss(b, b.size);
    const lines = wrapLines(ctx, b.text.innerText, innerW);
    const boxH = Math.max(b.h, lines.length * lh + 2 * p);
    if (b.bgOn) { ctx.fillStyle = hexToRgba(b.bg, b.bgAlpha / 100); ctx.fillRect(b.x, b.y, b.w, boxH); }
    ctx.fillStyle = b.color;
    ctx.textAlign = b.align;
    ctx.textBaseline = 'middle';
    const ax = b.align === 'left' ? b.x + p : b.align === 'right' ? b.x + b.w - p : b.x + b.w / 2;
    lines.forEach((ln, i) => ctx.fillText(ln, ax, b.y + p + lh * i + lh / 2));
  }
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = imageName + '-annotated.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};
</script>
</body>
</html>
